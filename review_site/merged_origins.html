  .answer-box.conflict { background: var(--err-lt); color: var(--err); }

    font-size: 11.5px; color: var(--mut); font-style: italic;
    padding: 4px 8px; background: var(--bg);
    border-radius: 5px; margin-top: 4px;

  /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

<script>
/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   State
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let allClusters = [];
let filtered    = [];
let currentPage = 1;
const PAGE_SIZE = 20;

let debounceTimer = null;

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Theme toggle
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
const themeBtn = document.getElementById('themeToggle');
const html = document.documentElement;

function setTheme(dark) {
  html.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeBtn.textContent = dark ? 'â˜€ï¸ Light' : 'ðŸŒ™ Dark';
  localStorage.setItem('mo_theme', dark ? 'dark' : 'light');
}
themeBtn.addEventListener('click', () => {
  setTheme(html.getAttribute('data-theme') !== 'dark');
});
// Restore saved theme
setTheme(localStorage.getItem('mo_theme') === 'dark');

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Helpers
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function abbrev(name, max = 30) {
  if (!name) return '?';
  const n = name.replace(/\.pdf$/i, '');
  return n.length > max ? n.slice(0, max - 1) + 'â€¦' : n;
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function uniqueOriginBooks(cluster) {
  // Deduplicate by source_file
  const seen = new Set();
  const out  = [];
  for (const m of (cluster.members || [])) {
    const key = m.source_file + '||' + m.source_page;
    if (!seen.has(key)) {
      seen.add(key);
      out.push({ file: m.source_file, page: m.source_page });
    }
  }
  return out;
}

function hasAnswer(cluster) {
  return (cluster.members || []).some(m => m.answer_letter || m.answer_evidence);
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Build option text from options dict
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderOptions(options) {
  if (!options || !Object.keys(options).length) return '';
  let html = '<div class="options-grid">';
  for (const [k, v] of Object.entries(options)) {
    html += `<span class="opt-key">${escHtml(k)}.</span><span class="opt-val">${escHtml(v)}</span>`;
  }
  html += '</div>';
  return html;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Render a single cluster card
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderCard(cluster) {
  const conflict   = cluster.has_conflict;
  const lesson     = cluster.canonical_lesson || '';
  const qtype      = cluster.canonical_qtype  || '';
  const count      = cluster.repeat_count     || (cluster.members || []).length;
  const canonQ     = cluster.canonical_question || '';
  const members    = cluster.members || [];
  const origins    = uniqueOriginBooks(cluster);
  const autoExpand = members.length === 1;

  // Badges row
  let badges = '';
  if (lesson) badges += `<span class="badge badge-lesson">${escHtml(lesson)}</span>`;
  if (qtype)  badges += `<span class="badge badge-qtype">${escHtml(qtype.toUpperCase())}</span>`;
  if (conflict) badges += `<span class="badge badge-conflict">âš ï¸ Conflict</span>`;
  badges += `<span class="badge-source-count">Found in ${count} source${count !== 1 ? 's' : ''}</span>`;

  // Origin pills
  const originPills = origins.map(o =>
    `<span class="book-pill" title="${escHtml(o.file)}">${escHtml(abbrev(o.file))} p.${o.page}</span>`
  ).join('');

  // Members HTML
  let membersHtml = '';
  for (let i = 0; i < members.length; i++) {
    const m = members[i];
    const sameQ = (m.question || '').trim() === canonQ.trim();
    const qClass = sameQ ? 'member-question same-as-canonical' : 'member-question';
    const qText  = sameQ ? '(same as canonical)' : escHtml(m.question);

    // Answer box
    let answerHtml = '';
    if (m.answer_letter) {
      const optText = m.options && m.options[m.answer_letter]
        ? ` â€” "${escHtml(m.options[m.answer_letter])}"` : '';
      const isConflict = conflict && i > 0 &&
        members[0].answer_letter && m.answer_letter !== members[0].answer_letter;
      const cls = isConflict ? 'conflict' : 'shown';
      answerHtml = `<div class="answer-box ${cls}">âœ… Answer: ${escHtml(m.answer_letter)}${optText}</div>`;
    } else if (m.answer_status === 'shown_in_file' && m.answer_evidence) {
      answerHtml = `<div class="answer-box shown">âœ… Answer shown in file</div>`;
    } else {
      answerHtml = `<div class="answer-box not-shown">â“ Answer not shown</div>`;
    }

    // Evidence
    const evHtml = m.answer_evidence
      ? `<div class="evidence-text">ðŸ“ Evidence: ${escHtml(m.answer_evidence.slice(0, 300))}${m.answer_evidence.length > 300 ? 'â€¦' : ''}</div>`
      : '';

    membersHtml += `
      <div class="member-block">
        <div class="member-header">
          <span class="src-badge" title="${escHtml(m.source_file)}">${escHtml(abbrev(m.source_file, 40))}</span>
          <span>page ${m.source_page}${m.q_number ? ' Â· Q' + escHtml(String(m.q_number)) : ''}</span>
        </div>
        <div class="member-body">
          <div class="${qClass}">${qText}</div>
          ${renderOptions(m.options)}
          ${answerHtml}
          ${evHtml}
        </div>
      </div>`;
  }

  const openClass = autoExpand ? ' open' : '';
  const btnClass  = autoExpand ? ' open' : '';
  const toggleLabel = autoExpand ? '' : `â–¼ Show all ${members.length} versions`;

  return `
<div class="cluster-card${conflict ? ' has-conflict' : ''}" data-id="${cluster.cluster_id}">
  <div class="card-header">
    ${badges}
  </div>
  <div class="card-body">
    <div class="canonical-q">
      <span class="label">ðŸ“Œ Canonical Question</span>
      ${escHtml(canonQ)}
    </div>
    <div class="origins-row">
      <span class="origins-label">ðŸ“š Origins:</span>
      ${originPills}
    </div>
    ${autoExpand ? '' : `<button class="toggle-btn${btnClass}" data-cid="${cluster.cluster_id}">
      <span class="toggle-icon">â–¼</span> Show all ${members.length} versions
    </button>`}
    <div class="members-wrap${openClass}" id="mwrap-${cluster.cluster_id}">
      ${membersHtml}
    </div>
  </div>
</div>`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Render the current page
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderPage() {
  const list      = document.getElementById('clusterList');
  const empty     = document.getElementById('emptyState');
  const pagination = document.getElementById('pagination');
  const countEl   = document.getElementById('resultCount');
  const pageInfo  = document.getElementById('pageInfo');
  const prevBtn   = document.getElementById('prevBtn');
  const nextBtn   = document.getElementById('nextBtn');

  const total   = filtered.length;
  const totalPg = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (currentPage > totalPg) currentPage = totalPg;

  const start = (currentPage - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  countEl.textContent = `Showing ${total === allClusters.length ? 'all' : total + ' of ' + allClusters.length} clusters`;

  if (total === 0) {
    list.style.display = 'none';
    empty.style.display = '';
    pagination.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  list.style.display = 'flex';
  pagination.style.display = 'flex';

  list.innerHTML = slice.map(renderCard).join('');

  pageInfo.textContent = `Page ${currentPage} of ${totalPg}`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPg;

  // Attach toggle listeners
  list.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cid  = btn.dataset.cid;
      const wrap = document.getElementById('mwrap-' + cid);
      const open = wrap.classList.toggle('open');
      btn.classList.toggle('open', open);
      const icon = btn.querySelector('.toggle-icon');
      if (icon) icon.style.transform = open ? 'rotate(180deg)' : '';
      const count = allClusters.find(c => String(c.cluster_id) === String(cid))?.members?.length || 0;
      // update label
      const textNode = btn.childNodes[btn.childNodes.length - 1];
      if (textNode && textNode.nodeType === Node.TEXT_NODE) {
        textNode.textContent = open ? ` Hide versions` : ` Show all ${count} versions`;
      }
    });
  });
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Filter logic
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function applyFilters() {
  const q           = document.getElementById('searchInput').value.trim().toLowerCase();
  const lesson      = document.getElementById('lessonFilter').value;
  const srcCount    = parseInt(document.getElementById('sourceCountFilter').value) || 0;
  const status      = document.getElementById('statusFilter').value;
  const qtype       = document.getElementById('qtypeFilter').value.toLowerCase();

  filtered = allClusters.filter(c => {
    // text search
    if (q && !(c.canonical_question || '').toLowerCase().includes(q)) return false;
    // lesson
    if (lesson && (c.canonical_lesson || '') !== lesson) return false;
    // source count
    if (srcCount > 0 && (c.repeat_count || 0) < srcCount) return false;
    // status
    if (status === 'conflict'  && !c.has_conflict)     return false;
    if (status === 'answered'  && !hasAnswer(c))        return false;
    if (status === 'no-answer' && hasAnswer(c))         return false;
    // qtype
    if (qtype && (c.canonical_qtype || '').toLowerCase() !== qtype) return false;
    return true;
  });

  currentPage = 1;
  renderPage();
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Populate lesson dropdown
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function populateLessons() {
  const lessons = [...new Set(allClusters.map(c => c.canonical_lesson || '').filter(Boolean))].sort();
  const sel = document.getElementById('lessonFilter');
  lessons.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    sel.appendChild(opt);
  });
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Update header stats
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function updateStats() {
  const total    = allClusters.length;
  const conflicts = allClusters.filter(c => c.has_conflict).length;
  const multi    = allClusters.filter(c => (c.repeat_count || 0) >= 3).length;
  document.getElementById('pillTotal').textContent    = `${total.toLocaleString()} clusters`;
  document.getElementById('pillConflict').textContent = `${conflicts.toLocaleString()} conflicts`;
  document.getElementById('pillMulti').textContent    = `${multi.toLocaleString()} multi-source (3+)`;
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   CSV Export
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = [['cluster_id','lesson','qtype','canonical_question','repeat_count','has_conflict','sources']];
  for (const c of filtered) {
    const sources = (c.appears_in || []).join(' | ').replace(/"/g, '""');
    const q       = (c.canonical_question || '').replace(/"/g, '""');
    const lesson  = (c.canonical_lesson   || '').replace(/"/g, '""');
    rows.push([
      c.cluster_id,
      `"${lesson}"`,
      c.canonical_qtype || '',
      `"${q}"`,
      c.repeat_count || 0,
      c.has_conflict ? 'true' : 'false',
      `"${sources}"`
    ]);
  }
  const csv  = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'merged_origins_export.csv';
  a.click();
  URL.revokeObjectURL(url);
});

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Event listeners
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(applyFilters, 300);
});
['lessonFilter','sourceCountFilter','statusFilter','qtypeFilter'].forEach(id => {
  document.getElementById(id).addEventListener('change', applyFilters);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('lessonFilter').value = '';
  document.getElementById('sourceCountFilter').value = '0';
  document.getElementById('statusFilter').value = '';
  document.getElementById('qtypeFilter').value = '';
  applyFilters();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo(0,0); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const totalPg = Math.ceil(filtered.length / PAGE_SIZE);
  if (currentPage < totalPg) { currentPage++; renderPage(); window.scrollTo(0,0); }
});

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
   Load data
â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
async function loadData() {
  const loader  = document.getElementById('loaderWrap');
  const list    = document.getElementById('clusterList');
  const statusEl = document.getElementById('dataStatus');

  try {
    const res = await fetch('../data/clusters.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    statusEl.textContent = 'â€” parsingâ€¦';
    allClusters = await res.json();
    filtered    = allClusters;

    populateLessons();
    updateStats();
    loader.style.display = 'none';
    statusEl.textContent = '';
    renderPage();
  } catch (err) {
    loader.innerHTML = `
      <div style="color:var(--err); text-align:center; padding:40px 20px;">
        <div style="font-size:32px; margin-bottom:12px;">âš ï¸</div>
        <div style="font-weight:700; font-size:16px; margin-bottom:8px;">Failed to load clusters.json</div>
        <div style="color:var(--mut); font-size:13px;">${escHtml(err.message)}</div>
        <div style="margin-top:12px; font-size:12px; color:var(--mut);">
          Make sure the file exists at <code>../data/clusters.json</code><br>
          and this page is served from a local server (not opened as file://).
        </div>
      </div>`;
  }
}

loadData();
</script>
